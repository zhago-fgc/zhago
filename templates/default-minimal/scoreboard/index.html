<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/scoreboard/style.css">
</head>
<body>
  <div id="scoreboard">
    <div class="player-block left">
      <div class="team" id="p1-team">TEAM</div>
      <div class="name" id="p1-name">Player 1</div>
    </div>
    <div class="score-block">
      <div class="score" id="p1-score">0</div>
      <div class="divider">
        <div class="round" id="round">Grand Finals</div>
        <div class="dash">—</div>
      </div>
      <div class="score" id="p2-score">0</div>
    </div>
    <div class="player-block right">
      <div class="name" id="p2-name">Player 2</div>
      <div class="team" id="p2-team">TEAM</div>
    </div>
  </div>
  <script src="/scoreboard/script.js"></script>
</body>
</html>
