<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/top8/style.css">
</head>
<body>
  <div id="top8">
    <div class="header">
      <div class="header-line"></div>
      <div class="header-title">Top 8</div>
      <div class="header-line"></div>
    </div>
    <div class="bracket">
      <!-- Winners side -->
      <div class="column">
        <div class="col-label">Winners</div>
        <div class="match" id="wf">
          <div class="match-label">Winners Finals</div>
          <div class="slot" id="wf-1"><span class="seed">1</span><span class="pname">TBD</span><span class="ptag"></span></div>
          <div class="slot" id="wf-2"><span class="seed">2</span><span class="pname">TBD</span><span class="ptag"></span></div>
        </div>
        <div class="match" id="gf">
          <div class="match-label">Grand Finals</div>
          <div class="slot winner" id="gf-1"><span class="seed">1</span><span class="pname">TBD</span><span class="ptag"></span></div>
          <div class="slot" id="gf-2"><span class="seed">2</span><span class="pname">TBD</span><span class="ptag"></span></div>
        </div>
      </div>
      <!-- Losers side -->
      <div class="column">
        <div class="col-label">Losers</div>
        <div class="match" id="lsf">
          <div class="match-label">Losers Semis</div>
          <div class="slot" id="lsf-1"><span class="seed">3</span><span class="pname">TBD</span><span class="ptag"></span></div>
          <div class="slot" id="lsf-2"><span class="seed">4</span><span class="pname">TBD</span><span class="ptag"></span></div>
        </div>
        <div class="match" id="lf">
          <div class="match-label">Losers Finals</div>
          <div class="slot" id="lf-1"><span class="seed">3</span><span class="pname">TBD</span><span class="ptag"></span></div>
          <div class="slot" id="lf-2"><span class="seed">4</span><span class="pname">TBD</span><span class="ptag"></span></div>
        </div>
      </div>
      <!-- Placements -->
      <div class="column placements">
        <div class="col-label">Results</div>
        <div class="placement" id="place-1"><span class="place-num">1st</span><span class="pname" id="p1st">TBD</span></div>
        <div class="placement" id="place-2"><span class="place-num">2nd</span><span class="pname" id="p2nd">TBD</span></div>
        <div class="placement" id="place-3"><span class="place-num">3rd</span><span class="pname" id="p3rd">TBD</span></div>
        <div class="placement" id="place-4"><span class="place-num">4th</span><span class="pname" id="p4th">TBD</span></div>
        <div class="placement" id="place-5"><span class="place-num">5th</span><span class="pname" id="p5th">TBD</span></div>
        <div class="placement" id="place-6"><span class="place-num">5th</span><span class="pname" id="p6th">TBD</span></div>
        <div class="placement" id="place-7"><span class="place-num">7th</span><span class="pname" id="p7th">TBD</span></div>
        <div class="placement" id="place-8"><span class="place-num">7th</span><span class="pname" id="p8th">TBD</span></div>
      </div>
    </div>
  </div>
  <script src="/top8/script.js"></script>
</body>
</html>
