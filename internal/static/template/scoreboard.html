<html>
	<head>
		<style>
		body {
			width: 1920px;
			height: 1080px;
			background: transparent;
			font-size: 50px;
			overflow: hidden;
		}
		</style>
	</head>
	<body>
		<div>
			<span class="team" id="player1-team">ABC</span>
			<span class="name" id="player1-name">Player 1 Name</span>	
			<span class="score" id="player1-score">0</span>
		</div>
		<div>
			<span class="team" id="player2-team">DEF</span>
			<span class="name" id="player2-name">Player 2 Name</span>
			<span class="score" id="player2-score">0</span>
		</div>
		<script type="text/javascript">
			const eventSource = new EventSource("/stream");

			const player1Name = document.getElementById("player1-name");
			const player1Team = document.getElementById("player1-team");
			const player1Score = document.getElementById("player1-score");

			const player2Name = document.getElementById("player2-name");
			const player2Team = document.getElementById("player2-team");
			const player2Score = document.getElementById("player2-score");


			eventSource.addEventListener("update", (event) =>{
				const data = JSON.parse(event.data);

				player1Name.textContent = data.player1Name;
				player1Team.textContent = data.player1Team;
				player1Score.textContent = data.player1Score;

				player2Name.textContent = data.player2Name;
				player2Team.textContent = data.player2Team;
				player2Score.textContent = data.player2Score;
			});

			eventSource.onerror = (err) => {
				console.log(err)
			};
		</script>
	</body>
</html>
