<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Casters — Overlay</title>
<style>
  body { margin: 0; background: transparent; font-family: system-ui, sans-serif; }
  #bar { position: fixed; bottom: 24px; left: 24px; display: flex; gap: 16px; }
  .caster { padding: 8px 16px; border-radius: 8px; }
  .caster .name { font-weight: 700; font-size: 15px; }
  .caster .meta { font-size: 12px; opacity: 0.75; }
  .caster:empty, .caster.hidden { display: none; }
</style>
</head>
<body>
  <div id="bar">
    <div class="caster hidden" id="c1">
      <div class="name" id="c1-name"></div>
      <div class="meta"><span id="c1-handle"></span> <span id="c1-pronouns"></span></div>
    </div>
    <div class="caster hidden" id="c2">
      <div class="name" id="c2-name"></div>
      <div class="meta"><span id="c2-handle"></span> <span id="c2-pronouns"></span></div>
    </div>
  </div>
<script>
  function fill(prefix, name, handle, pronouns) {
    const el = document.getElementById(prefix)
    el.classList.toggle('hidden', !name)
    document.getElementById(prefix + '-name').textContent = name || ''
    document.getElementById(prefix + '-handle').textContent = handle || ''
    document.getElementById(prefix + '-pronouns').textContent = pronouns || ''
  }

  function render(state) {
    fill('c1', state.commentator1Name, state.commentator1Handle, state.commentator1Pronouns)
    fill('c2', state.commentator2Name, state.commentator2Handle, state.commentator2Pronouns)
  }

  // Read-only: snapshot on connect, then live updates — never sends anything back.
  const source = new EventSource('/api/bus/casters/stream')
  source.onmessage = (e) => render(JSON.parse(e.data))
</script>
</body>
</html>
