<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Casters — Cockpit</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      h2 {
        font-size: 1rem;
      }
      h3 {
        font-size: 0.9rem;
      }
      fieldset {
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 1rem;
        padding: 1rem;
      }
      legend {
        font-weight: 600;
        padding: 0 0.4rem;
      }
      select {
        width: 100%;
        padding: 0.5rem;
      }
      .sides {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .sides fieldset {
        flex: 1;
        margin-bottom: 0;
      }
      button {
        padding: 0.6rem 1.2rem;
        cursor: pointer;
      }
      .preview-frame {
        width: 384px;
        height: 216px;
        overflow: hidden;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 0.5rem;
      }
      .preview-frame iframe {
        width: 1920px;
        height: 1080px;
        border: none;
        transform: scale(0.2);
        transform-origin: 0 0;
      }
      #embed-url {
        font-family: monospace;
        font-size: 0.8rem;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Casters</h1>

    <h2>Preview</h2>
    <div class="preview-frame">
      <iframe id="overlay-preview" src="../overlay/index.html"></iframe>
    </div>
    <h3>Embed</h3>
    <input id="embed-url" readonly onclick="this.select()" />

    <h2>On commentary now</h2>
    <form id="form">
      <div class="sides">
        <fieldset>
          <legend>Commentator 1</legend>
          <select id="c1-select">
            <option value="">— none —</option>
          </select>
        </fieldset>
        <fieldset>
          <legend>Commentator 2</legend>
          <select id="c2-select">
            <option value="">— none —</option>
          </select>
        </fieldset>
      </div>
      <button type="submit">Update overlay</button>
    </form>
    <p id="empty-roster-hint" style="display: none">
      No casters yet — add some in the Caster Directory module first.
    </p>

    <script>
      // Full absolute URL, since this is what gets pasted into OBS's browser
      // source — a relative path means nothing outside this page.
      document.getElementById('embed-url').value = new URL(
        '../overlay/index.html',
        location.href,
      ).href;

      let roster = [];

      function populateSelect(select) {
        const current = select.value;
        select.innerHTML =
          '<option value="">— none —</option>' +
          roster.map((c) => '<option value="' + c.id + '">' + c.name + '</option>').join('');
        select.value = current;
      }

      // caster-directory is the source of truth for who exists — this cockpit
      // only picks *which* of them are on commentary right now, never retypes them.
      const rosterSource = new EventSource('/api/bus/caster-directory/stream');
      rosterSource.onmessage = (e) => {
        roster = JSON.parse(e.data) || [];
        document.getElementById('empty-roster-hint').style.display = roster.length
          ? 'none'
          : 'block';
        populateSelect(document.getElementById('c1-select'));
        populateSelect(document.getElementById('c2-select'));
      };

      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const find = (id) => roster.find((c) => c.id === id);
        const c1 = find(document.getElementById('c1-select').value);
        const c2 = find(document.getElementById('c2-select').value);
        await fetch('/api/bus/casters/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            commentator1Name: c1?.name || '',
            commentator1Handle: c1?.handle || '',
            commentator1Pronouns: c1?.pronouns || '',
            commentator2Name: c2?.name || '',
            commentator2Handle: c2?.handle || '',
            commentator2Pronouns: c2?.pronouns || '',
          }),
        });
      });
    </script>
  </body>
</html>
