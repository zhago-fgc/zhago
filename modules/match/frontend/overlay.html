<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Match — Overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="board">
    <div class="side p1 hidden" id="p1">
      <span class="panel-bg"></span>
      <span class="score-chip" id="p1-score"></span>
      <span class="info">
        <span class="name" id="p1-name"></span>
        <span class="team" id="p1-team"></span>
      </span>
    </div>
    <div class="round-chip">
      <span id="round"></span>
    </div>
    <div class="side p2 hidden" id="p2">
      <span class="panel-bg"></span>
      <span class="info">
        <span class="name" id="p2-name"></span>
        <span class="team" id="p2-team"></span>
      </span>
      <span class="score-chip" id="p2-score"></span>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
