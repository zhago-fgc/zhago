<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Match — Cockpit</title>
<link rel="stylesheet" href="cockpit.css">
</head>
<body>
  <h1>Match</h1>

  <h2>Preview</h2>
  <div class="preview-frame">
    <iframe id="overlay-preview" src="overlay.html"></iframe>
  </div>
  <h3>Embed</h3>
  <input id="embed-url" readonly onclick="this.select()">

  <h2>Edit</h2>
  <form id="form">
    <fieldset>
      <legend>Player 1</legend>
      <div class="row">
        <input id="p1-name" placeholder="Tag (e.g. SonicFox)">
        <input id="p1-team" placeholder="Team (optional)">
        <input id="p1-score" type="number" min="0" value="0">
      </div>
    </fieldset>
    <fieldset>
      <legend>Player 2</legend>
      <div class="row">
        <input id="p2-name" placeholder="Tag (e.g. Hikari)">
        <input id="p2-team" placeholder="Team (optional)">
        <input id="p2-score" type="number" min="0" value="0">
      </div>
    </fieldset>
    <div class="row">
      <input id="round" placeholder="Round (e.g. Grand Finals)">
      <input id="best-of" type="number" min="1" value="3" placeholder="Bo">
    </div>
    <button type="submit">Update overlay</button>
  </form>
  <script src="cockpit.js"></script>
</body>
</html>
