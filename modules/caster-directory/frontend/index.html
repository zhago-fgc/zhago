<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Caster Directory — Cockpit</title>
    <link rel="stylesheet" href="/assets/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/cockpit.css" />
    <script src="/assets/theme.js"></script>
  </head>
  <body>
    <div class="container py-4">
      <h1>Caster Directory</h1>

      <h2 class="h5 mt-4" id="form-heading">Add a caster</h2>
      <form id="form" class="field-row mb-4">
        <input id="name" class="form-control" placeholder="Name" required />
        <input id="handle" class="form-control" placeholder="Handle (optional)" />
        <input id="pronouns" class="form-control" placeholder="Pronouns (optional)" />
        <button type="submit" id="submit-btn" class="btn btn-primary text-nowrap">Add</button>
        <button type="button" id="cancel-btn" class="btn btn-outline-secondary text-nowrap hidden">
          Cancel
        </button>
      </form>

      <h2 class="h5">Roster</h2>
      <ul id="list" class="list-group"></ul>
      <p id="empty-hint" class="text-body-secondary small mt-3" style="display: none">
        No casters saved yet — add one above, or they're added automatically from the Casters
        cockpit the first time someone new is entered there.
      </p>
    </div>

    <script src="index.js"></script>
  </body>
</html>
