<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Match Overlay - Neon Grid</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main id="board">
      <section class="side p1 hidden" id="p1">
        <div class="label">Player 1</div>
        <div class="name" id="p1-name"></div>
        <div class="meta" id="p1-meta"></div>
        <div class="score" id="p1-score"></div>
      </section>

      <section class="round">
        <div class="round-label">Round</div>
        <div class="round-name" id="round"></div>
      </section>

      <section class="side p2 hidden" id="p2">
        <div class="label">Player 2</div>
        <div class="name" id="p2-name"></div>
        <div class="meta" id="p2-meta"></div>
        <div class="score" id="p2-score"></div>
      </section>
    </main>

    <script src="index.js"></script>
  </body>
</html>
