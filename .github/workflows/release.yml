name: release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Generate embedded asset module
        run: bun run scripts/generate-ui-embed.ts

      - name: Typecheck core
        run: bun run tsc --noEmit

      - name: Typecheck app
        run: cd app && bun run vue-tsc -b

      - name: Test
        run: |
          if compgen -G "test/*.test.ts" > /dev/null; then
            bun test
          else
            echo "No tests yet"
          fi

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: zhago-linux-x64
          - target: bun-linux-arm64
            artifact: zhago-linux-arm64
          - target: bun-linux-x64-musl
            artifact: zhago-linux-x64-musl
          - target: bun-linux-arm64-musl
            artifact: zhago-linux-arm64-musl
          - target: bun-darwin-x64
            artifact: zhago-darwin-x64
          - target: bun-darwin-arm64
            artifact: zhago-darwin-arm64
          - target: bun-windows-x64
            artifact: zhago-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: cd app && bun run vue-tsc -b && bun run vite build

      - name: Generate embedded assets
        run: bun run scripts/generate-ui-embed.ts

      - name: Build binary
        run: bun build --compile --target=${{ matrix.target }} src/server.ts --outfile build/${{ matrix.artifact }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}

  build-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zhago-linux-x64-musl
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: zhago-linux-arm64-musl
          path: build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  publish:
    needs: [build, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
