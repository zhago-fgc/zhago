name: pull-request

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Validate registry
        run: bun run validate:registry

      - name: Generate embedded asset module
        run: bun run scripts/generate-ui-embed.ts

      - name: Typecheck core
        run: bun run tsc --noEmit

      - name: Typecheck app
        run: cd app && bun run vue-tsc -b

      - name: Test
        run: |
          if compgen -G "test/*.test.ts" > /dev/null; then
            bun test
          else
            echo "No tests yet"
          fi

      - name: Build frontend
        run: cd app && bun run vite build

      - name: Generate embedded assets
        run: bun run scripts/generate-ui-embed.ts

      - name: Build binary
        run: bun build --compile src/server.ts --outfile build/zhago
